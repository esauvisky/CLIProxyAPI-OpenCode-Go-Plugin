name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-amd64
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: CLIProxyAPI-OpenCode-Go-Plugin
      - uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyAPI
      - uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/go.mod
      - name: Build and test
        working-directory: CLIProxyAPI-OpenCode-Go-Plugin
        env:
          GOTOOLCHAIN: auto
        run: |
          go mod tidy
          make test
      - name: Name release artifact
        working-directory: CLIProxyAPI-OpenCode-Go-Plugin
        run: cp build/opencode-go-oauth.so build/opencode-go-oauth-${{ matrix.artifact }}.so
      - name: Package Plugin Store archive
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: CLIProxyAPI-OpenCode-Go-Plugin
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          archive="opencode-go-oauth_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          (cd build && zip "$archive" opencode-go-oauth.so)
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-go-oauth-${{ matrix.artifact }}
          path: |
            CLIProxyAPI-OpenCode-Go-Plugin/build/opencode-go-oauth-${{ matrix.artifact }}.so
            CLIProxyAPI-OpenCode-Go-Plugin/build/opencode-go-oauth_*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opencode-go-oauth-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          sha256sum opencode-go-oauth_*.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" \
            opencode-go-oauth-linux-amd64.so \
            opencode-go-oauth-linux-arm64.so \
            opencode-go-oauth_*.zip \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
